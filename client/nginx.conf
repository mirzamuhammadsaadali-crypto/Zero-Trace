server {
  listen 80; root /usr/share/nginx/html; index index.html;
  add_header X-Content-Type-Options nosniff; add_header X-Frame-Options DENY;
  location /api/ { proxy_pass http://server:3001; }
  location /ws { proxy_pass http://server:3001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { try_files $uri /index.html; }
}
